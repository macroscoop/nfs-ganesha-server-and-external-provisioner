# Default values for nfs-provisioner.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

# imagePullSecrets:

image:
  repository: registry.k8s.io/sig-storage/nfs-provisioner
  tag: v6.5
  # digest:
  pullPolicy: IfNotPresent

# For a list of available arguments
# Please see https://github.com/kubernetes-incubator/external-storage/blob/HEAD/nfs/docs/deployment.md#arguments
extraArgs: {}
  # device-based-fsids: false
  # grace-period: 0

# NFSv3 support. NFSv4 multiplexes everything over the single 2049 data port,
# so the NFSv3 ancillary services (rpcbind, statd, mountd, nlockmgr, rquotad)
# are only needed by v3 clients. Set enabled to false for an NFSv4-only server:
# rpcbind/statd are not started, ganesha is pinned to v4 with no UDP listeners
# or RQUOTA (no portmapper needed), the v3 container & Service ports are dropped
# (leaving only 2049/TCP exposed), and the provisioner validates its Service
# against just that single port (-enable-nfs-v3=false).
# When disabling this, make sure clients mount with a v4 minor version, e.g.
# storageClass.mountOptions: [vers=4.2].
nfsV3:
  enabled: true

service:
  type: ClusterIP

  nfsPort: 2049
  nlockmgrPort: 32803
  mountdPort: 20048
  rquotadPort: 875
  rpcbindPort: 111
  statdPort: 662
  # nfsNodePort:
  # nlockmgrNodePort:
  # mountdNodePort:
  # rquotadNodePort:
  # rpcbindNodePort:
  # statdNodePort:
  # clusterIP:

  externalIPs: []

persistence:
  enabled: false

  ## Existing Persistent Volume Claim
  ## This should be used with persistence.enabled=true
  ## If defined, an existing volume claim will be used, instead
  ## of creating a new one. i.e. volume definition:
  ## persistentVolumeClaim:
  ##   claimName: {{ tpl .Values.persistence.existingClaim . }}
  # existingClaim: "my-existing-pvc"

  ## Persistent Volume Storage Class
  ## If defined, storageClassName: <storageClass>
  ## If set to "-", storageClassName: "", which disables dynamic provisioning
  ## If undefined (the default) or set to null, no storageClassName spec is
  ##   set, choosing the default provisioner.  (gp2 on AWS, standard on
  ##   GKE, AWS & OpenStack)
  ##
  # storageClass: "-"

  accessMode: ReadWriteOnce
  size: 1Gi

## For creating the StorageClass automatically:
storageClass:
  create: true

  ## Set a provisioner name. If unset, a name will be generated.
  # provisionerName:

  ## Set StorageClass as the default StorageClass
  ## Ignored if storageClass.create is false
  defaultClass: false

  ## Set a StorageClass name
  ## Ignored if storageClass.create is false
  name: nfs

  # set to null to prevent expansion
  allowVolumeExpansion: true
  ## StorageClass parameters
  parameters: {}

  mountOptions:
    - vers=4.1
    - retrans=2
    - timeo=30

  ## ReclaimPolicy field of the class, which can be either Delete or Retain
  reclaimPolicy: Delete

## For RBAC support:
rbac:
  create: true

  ## Ignored if rbac.create is true
  ##
  serviceAccountName: default

securityContext:
  capabilities:
    add:
      - DAC_READ_SEARCH
      - SYS_RESOURCE

## For creating the PriorityClass automatically:
priorityClass:
  ## Enable creation of a PriorityClass resource for this nfs-server-provisioner instance
  create: false

  ## Set a PriorityClass name to override the default name
  name: ""

  ## PriorityClass value. The higher the value, the higher the scheduling priority
  value: 5

resources: {}
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
